x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  bornemap-net:
    driver: bridge

services:
  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    container_name: postgres
    hostname: postgres.internal
    networks:
      bornemap-net:
        aliases:
          - postgres.internal
    env_file: ../env/local/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-borne} -d ${POSTGRES_DB:-bornemap}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    build:
      context: ../rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    hostname: rabbitmq.internal
    networks:
      bornemap-net:
        aliases:
          - rabbitmq.internal
    ports:
      - "15672:15672"
    env_file: ../env/local/rabbitmq.env
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      - rmqdata:/var/lib/rabbitmq
    restart: unless-stopped
    logging: *default-logging

  keycloak:
    build:
      context: ../keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    hostname: keycloak.internal
    command: ["start-dev"]
    networks:
      bornemap-net:
        aliases:
          - keycloak.internal
    ports:
      - "8090:8080"
    env_file: ../env/local/keycloak.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  traefik:
    image: traefik:v3.1
    container_name: traefik
    hostname: traefik.internal
    networks:
      - bornemap-net
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=bornemap-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: []
    restart: unless-stopped
    logging: *default-logging

  driver-service:
    build:
      context: ../../.
      dockerfile: services/driver-service/Dockerfile
    container_name: driver-service
    hostname: driver.internal
    networks:
      bornemap-net:
        aliases:
          - driver.internal
    env_file: ../env/local/driver-service.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.driver.rule=PathPrefix(`/api/driver`)"
      - "traefik.http.routers.driver.entrypoints=web"
      - "traefik.http.services.driver.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.strip-driver.stripprefix.prefixes=/api/driver"
      - "traefik.http.routers.driver.middlewares=strip-driver"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  admin-service:
    build:
      context: ../../.
      dockerfile: services/admin-service/Dockerfile
    container_name: admin-service
    hostname: admin.internal
    networks:
      bornemap-net:
        aliases:
          - admin.internal
    env_file: ../env/local/admin-service.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=PathPrefix(`/api/admin`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=3002"
      - "traefik.http.middlewares.strip-admin.stripprefix.prefixes=/api/admin"
      - "traefik.http.routers.admin.middlewares=strip-admin"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  clickstream-service:
    build:
      context: ../../.
      dockerfile: services/clickstream-service/Dockerfile
    container_name: clickstream-service
    hostname: clickstream.internal
    networks:
      bornemap-net:
        aliases:
          - clickstream.internal
    env_file: ../env/local/clickstream-service.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clickstream.rule=PathPrefix(`/api/clickstream`)"
      - "traefik.http.routers.clickstream.entrypoints=web"
      - "traefik.http.services.clickstream.loadbalancer.server.port=3003"
      - "traefik.http.middlewares.strip-clickstream.stripprefix.prefixes=/api/clickstream"
      - "traefik.http.routers.clickstream.middlewares=strip-clickstream"
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  gis-worker:
    build:
      context: ../../.
      dockerfile: services/gis-worker/Dockerfile
    container_name: gis-worker
    hostname: gis.internal
    networks:
      bornemap-net:
        aliases:
          - gis.internal
    env_file: ../env/local/gis-worker.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  analytics-writer:
    build:
      context: ../../.
      dockerfile: services/analytics-writer/Dockerfile
    container_name: analytics-writer
    hostname: analytics.internal
    networks:
      bornemap-net:
        aliases:
          - analytics.internal
    env_file: ../env/local/analytics-writer.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  rmqdata:
