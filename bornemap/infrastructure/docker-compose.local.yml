services:
  bornemap-database:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bornemap
      POSTGRES_PASSWORD: bornemap
      POSTGRES_DB: bornemap_dev
    volumes:
      - bornemap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap -d bornemap_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bornemap-pgdata:
