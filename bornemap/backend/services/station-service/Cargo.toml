[package]
name = "station-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bornemap-backend"
path = "src/main.rs"

[lib]
name = "station_service"
path = "src/lib.rs"

[dependencies]
common-utils = { path = "../../libs/common-utils" }
actix-web = "4"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "json"] }
utoipa = { version = "4", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "4", features = ["actix-web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
prometheus = "0.13"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
opening-hours = "0"
lazy_static = "1"
tracing-actix-web = "0.7"

[dev-dependencies]
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres"] }
