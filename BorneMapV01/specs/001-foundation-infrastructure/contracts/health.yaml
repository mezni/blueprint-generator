openapi: 3.1.0
info:
  title: BorneMap Health API
  version: 0.1.0
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [alive]
                example:
                  status: alive
  /health/ready:
    get:
      summary: Readiness probe (database connection)
      operationId: healthReady
      responses:
        "200":
          description: Server and database are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                  database:
                    type: string
                    enum: [connected]
                example:
                  status: ready
                  database: connected
        "503":
          description: Database not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                example:
                  status: unhealthy
                  database: disconnected
