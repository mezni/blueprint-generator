name: Backend CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: borne
          POSTGRES_PASSWORD: map
          POSTGRES_DB: borne
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: bornemap/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: black --check .

      - run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://borne:map@localhost:5432/borne
