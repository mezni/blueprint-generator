      # SSH example:
      #   - uses: appleboy/ssh-action@v1
      #     with:
      #       host: ${{ secrets.DEPLOY_HOST }}
      #       username: ${{ secrets.DEPLOY_USER }}
      #       key: ${{ secrets.DEPLOY_KEY }}
      #       script: |
      #         docker pull ${{ steps.image.outputs.image }}
      #         docker service update --image ${{ steps.image.outputs.image }} bornemap-backend
      #
      # Helm example:
      #   - uses: azure/setup-helm@v4
      #   - run: helm upgrade bornemap ./chart --set image.tag=${{ steps.image.outputs.tag }}
      #
      - name: Deploy (placeholder)
        run: |
          echo "Ready to deploy: ${{ steps.image.outputs.image }}"
          echo "Configure your deployment target in .github/workflows/deploy.yml"
