[package]
name = "analytics-service"
version = "1.14.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
tokio = { version = "1.35", features = ["full"] }
lapin = "2.3"
mongodb = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
core = { path = "../core" }
