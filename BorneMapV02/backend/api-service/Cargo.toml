[package]
name = "api-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono"] }
lapin = "2.3"
regex = "1.5"
mongodb = "2.8"
futures-util = "0.3"
core = { path = "../core" }
infra = { path = "../infra" }
