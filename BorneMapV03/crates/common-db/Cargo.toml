[package]
name = "common-db"
version = "0.1.0"
edition.workspace = true

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
contracts = { path = "../contracts" }
