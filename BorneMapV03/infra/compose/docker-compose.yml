services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: borne-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-borne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-borne_map}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/compose/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-borne} -d ${POSTGRES_DB:-borne_map}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: borne-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal_backend
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: borne-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-borne_map}
      KC_DB_USERNAME: ${POSTGRES_USER:-borne}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    command: ["start-dev", "--import-realm"]
    volumes:
      - ../../infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - internal_backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3; cat <&3 | head -n 1 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  traefik:
    image: traefik:v3.0
    container_name: borne-traefik
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../infra/traefik:/etc/traefik:ro
    networks:
      - public_network
      - internal_backend
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  admin-service:
    build:
      context: ../../
      dockerfile: infra/docker/admin-service.Dockerfile
    container_name: borne-admin-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-borne-map}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-backend-service}
      RUST_LOG: ${RUST_LOG:-info,json}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    networks:
      - internal_backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  driver-service:
    build:
      context: ../../
      dockerfile: infra/docker/driver-service.Dockerfile
    container_name: borne-driver-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-borne-map}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-backend-service}
      RUST_LOG: ${RUST_LOG:-info,json}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    networks:
      - internal_backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  clickstream-service:
    build:
      context: ../../
      dockerfile: infra/docker/clickstream-service.Dockerfile
    container_name: borne-clickstream-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUST_LOG: ${RUST_LOG:-info,json}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    networks:
      - internal_backend
    depends_on:
      rabbitmq:
        condition: service_healthy

  gis-sync-worker:
    build:
      context: ../../
      dockerfile: infra/docker/gis-sync-worker.Dockerfile
    container_name: borne-gis-sync-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUST_LOG: ${RUST_LOG:-info,json}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    networks:
      - internal_backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  driver-web:
    build:
      context: ../../
      dockerfile: apps/driver-web/Dockerfile
    container_name: borne-driver-web
    networks:
      - internal_backend
    depends_on:
      traefik:
        condition: service_started

  admin-dashboard:
    build:
      context: ../../
      dockerfile: apps/admin-dashboard/Dockerfile
    container_name: borne-admin-dashboard
    networks:
      - internal_backend
    depends_on:
      traefik:
        condition: service_started

  partner-dashboard:
    build:
      context: ../../
      dockerfile: apps/partner-dashboard/Dockerfile
    container_name: borne-partner-dashboard
    networks:
      - internal_backend
    depends_on:
      traefik:
        condition: service_started

networks:
  public_network:
    driver: bridge
  internal_backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
