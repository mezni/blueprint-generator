services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: borne
      POSTGRES_PASSWORD: map
      POSTGRES_DB: borne
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U borne -d borne
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./bornemap/backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://borne:map@db:5432/borne
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./bornemap/backend
          action: rebuild
