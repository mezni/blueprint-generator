# Station Spatial API — OpenAPI 3.1 Contract
# Generated from FastAPI Pydantic models. This is a reference contract
# documenting the spatial endpoint conventions for Phase 1.

openapi: "3.1.0"
info:
  title: BorneMap Station Spatial API
  version: "0.1.0"

paths:
  /api/v1/stations:
    get:
      summary: List stations (optionally viewport-filtered)
      parameters:
        - name: sw_lat
          in: query
          schema: { type: number }
        - name: sw_lng
          in: query
          schema: { type: number }
        - name: ne_lat
          in: query
          schema: { type: number }
        - name: ne_lng
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of stations

    post:
      summary: Create a new station
      security:
        - MockAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationCreate"
      responses:
        "201":
          description: Station created

  /api/v1/stations/nearby:
    get:
      summary: Find nearby stations by radius
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
        - name: radius_m
          in: query
          schema: { type: integer, default: 20000 }
      responses:
        "200":
          description: List of nearby stations sorted by distance

  /api/v1/stations/{id}:
    get:
      summary: Get station by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Station detail

    patch:
      summary: Update station fields
      security:
        - MockAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Station updated

    delete:
      summary: Delete a station
      security:
        - MockAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Station deleted

components:
  securitySchemes:
    MockAuth:
      type: apiKey
      in: header
      name: X-Mock-Token

  schemas:
    StationCreate:
      type: object
      required: [name, location]
      properties:
        name: { type: string }
        operator: { type: string }
        address: { type: string }
        location:
          $ref: "#/components/schemas/CoordinatePoint"
        plug_types:
          type: array
          items: { type: string }
        speed_kw: { type: number }
        is_active: { type: boolean }

    CoordinatePoint:
      type: object
      required: [coordinates, type]
      properties:
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "[longitude, latitude]"
        type:
          type: string
          enum: [Point]
