# Traefik dynamic routing configuration for local development.
# Uses PathPrefix matching for localhost-based routing.
http:
  routers:
    auth:
      rule: "PathPrefix(`/auth`)"
      service: keycloak
      entryPoints:
        - web

    driver:
      rule: "PathPrefix(`/api/v1/driver`)"
      service: driver-service
      entryPoints:
        - web

    partner:
      rule: "PathPrefix(`/api/v1/partner`)"
      service: admin-service
      entryPoints:
        - web

    admin:
      rule: "PathPrefix(`/api/v1/admin`)"
      middlewares:
        - strip-admin
      service: admin-service
      entryPoints:
        - web

    clickstream:
      rule: "PathPrefix(`/api/v1/clickstream`)"
      service: clickstream-service
      entryPoints:
        - web

    gis:
      rule: "PathPrefix(`/api/v1/gis`)"
      middlewares:
        - strip-gis
      service: gis-worker
      entryPoints:
        - web

    analytics:
      rule: "PathPrefix(`/api/v1/analytics`)"
      middlewares:
        - strip-analytics
      service: analytics-writer
      entryPoints:
        - web

  middlewares:
    strip-admin:
      stripPrefix:
        prefixes:
          - "/api/v1/admin"

    strip-clickstream:
      stripPrefix:
        prefixes:
          - "/api/v1/clickstream"

    strip-gis:
      stripPrefix:
        prefixes:
          - "/api/v1/gis"

    strip-analytics:
      stripPrefix:
        prefixes:
          - "/api/v1/analytics"

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

    driver-service:
      loadBalancer:
        servers:
          - url: "http://driver-service:8081"

    admin-service:
      loadBalancer:
        servers:
          - url: "http://admin-service:8082"

    clickstream-service:
      loadBalancer:
        servers:
          - url: "http://clickstream-service:8083"

    gis-worker:
      loadBalancer:
        servers:
          - url: "http://gis-worker:8084"

    analytics-writer:
      loadBalancer:
        servers:
          - url: "http://analytics-writer:8085"
