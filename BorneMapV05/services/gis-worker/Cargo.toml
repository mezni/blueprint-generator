[package]
name = "gis-worker"
version.workspace = true
edition.workspace = true

[dependencies]
common-types = { path = "../../crates/common-types" }
common-errors = { path = "../../crates/common-errors" }
common-auth = { path = "../../crates/common-auth" }
common-db = { path = "../../crates/common-db" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.8"

[[bin]]
name = "gis-worker"
path = "src/main.rs"

[[bin]]
name = "osm-import"
path = "src/bin/osm_import.rs"
